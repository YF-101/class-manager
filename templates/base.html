<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>班主任学生成绩系统</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #eef2f9 0%, #d9e4f5 100%);
  min-height: 100vh;
  padding: 36px 16px;
  color: #1f2937;
}
.container { max-width: 720px; margin: 0 auto; }

/* 顶部渐变标题栏 */
.topbar {
  background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
  color: #fff;
  border-radius: 16px;
  padding: 26px 26px;
  box-shadow: 0 10px 28px rgba(30,58,138,.28);
  margin-bottom: 22px;
}
.topbar h1 { font-size: 24px; font-weight: 700; letter-spacing: .5px; }
.topbar p { color: #c9d8ff; margin-top: 6px; font-size: 14px; }

/* 卡片 */
.card {
  background: #fff;
  border-radius: 14px;
  padding: 22px;
  box-shadow: 0 4px 16px rgba(0,0,0,.06);
  margin-bottom: 18px;
}
.card h2 { font-size: 16px; color: #1e3a8a; margin-bottom: 14px; }

/* 输入框 / 下拉框 */
input, select {
  padding: 10px 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
input:focus, select:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59,130,246,.16);
}

/* 按钮 */
.btn {
  border: none;
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 14px;
  color: #fff;
  cursor: pointer;
  transition: background .15s;
}
.btn-green { background:#16a34a; } .btn-green:hover { background:#15803d; }
.btn-blue  { background:#3b82f6; } .btn-blue:hover  { background:#2563eb; }
.btn-delete{ background:#dc2626; padding:6px 12px; font-size:12px; } .btn-delete:hover{ background:#b91c1c; }

/* 学生名单 */
.student-list { list-style:none; }
.student-list li {
  display: flex; justify-content: space-between; align-items: center;
  padding: 13px 14px; border:1px solid #e5e7eb; border-radius: 10px;
  margin-bottom: 8px; background:#f9fafb; transition: background .15s;
}
.student-list li:hover { background:#f1f5fb; }
.student-list .name { font-weight: 600; font-size: 15px; }
.student-list .links a { margin-left: 12px; font-size: 13px; }

/* 成绩表格 */
table { width:100%; border-collapse: collapse; }
th, td { padding: 11px 12px; text-align:left; border-bottom: 1px solid #eef1f6; font-size: 14px; }
th { background:#f1f5fb; color:#1e3a8a; font-weight:600; }
tbody tr:hover { background:#f8fafc; }
.fail { color:#dc2626; font-weight:700; }
.badge { font-size:12px; padding:2px 8px; border-radius:20px; }
.badge-ok  { background:#dcfce7; color:#15803d; }
.badge-fail{ background:#fee2e2; color:#b91c1c; }

/* 链接 */
a { color:#2563eb; text-decoration:none; }
a:hover { text-decoration:underline; }

/* 页脚 */
.footer { text-align:center; color:#6b7280; font-size:12px; margin-top:22px; }
.muted { color:#9ca3af; }

/* 导航按钮 */
.navbtn {
  color:#fff; background:rgba(255,255,255,.18);
  padding:6px 13px; border-radius:8px; font-size:13px;
}
.navbtn:hover { background:rgba(255,255,255,.32); text-decoration:none; }

/* 打印时只保留成绩单内容 */
@media print {
  body { background:#fff; padding:0; }
  .topbar, .footer, .no-print { display:none !important; }
  .card { box-shadow:none; border:1px solid #ddd; margin-bottom:10px; }
  .container { max-width:100%; }
}
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <h1>🎓 班主任学生成绩系统</h1>
    <p>记录班级每位学生的成绩与成长</p>
    <div style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
      <a href="/" class="navbtn">👥 学生名单</a>
      <a href="/exams" class="navbtn">📚 考试管理</a>
      <a href="/summary" class="navbtn">📊 全班汇总</a>
      <a href="/export_excel" class="navbtn">📥 导出Excel</a>
      <a href="/change_password" class="navbtn">🔑 改密码</a>
      {% if session.user == "admin" %}
      <a href="/users" class="navbtn">👤 用户管理</a>
      {% endif %}
      <span style="margin-left:auto; color:#c9d8ff; font-size:13px;">
        👤 {{ session.user }}
        <a href="/logout" class="navbtn" style="background:rgba(220,38,38,.85);">退出</a>
      </span>
    </div>
  </div>
  {% block content %}{% endblock %}
  <div class="footer">本地运行 · 数据保存在 class.db</div>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
