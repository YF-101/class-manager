{% extends "base.html" %}
{% block content %}
<p style="margin-bottom:16px;"><a href="{{ url_for('class_scores', exam_id=exam.id) }}">✏️ 打开本场考试整班录分表</a></p>
<div class="card">
  <h2>⚙️ 配置「{{ exam.name }}」的科目</h2>
  <p style="margin-bottom:12px">设置每科满分与及格线。已有成绩高于新满分时，会阻止下调满分。</p>
  <form action="/exam/{{ exam.id }}/apply_template" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button class="btn btn-blue">一键补齐山东高考模板</button>
  </form>
  <p style="margin-top:12px"><a href="/exams">← 返回考试列表</a></p>
</div>
<div class="card">
  <h2>科目与满分/及格线</h2>
  <div class="subject-grid">
    {% for s in subs %}
    <section class="subject-card">
      <h3>{{ s.subject }}</h3>
      <form action="/exam/{{ exam.id }}/update_subject/{{ s.id }}" method="post" class="subject-fields">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>满分<input name="max_score" value="{{ s.max_score | num }}" inputmode="decimal" required></label>
        <label>及格线<input name="pass_score" value="{{ s.pass_score | num }}" inputmode="decimal" required></label>
        <button class="btn btn-green">保存</button>
      </form>
      <form action="/exam/{{ exam.id }}/delete_subject/{{ s.id }}" method="post" class="subject-delete" onsubmit="return confirm('删除此科目及其全部成绩？此操作不可恢复。');">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="btn btn-delete">删除科目及成绩</button>
      </form>
    </section>
    {% else %}<p class="muted">还没有科目，请补齐模板或添加自定义科目。</p>{% endfor %}
  </div>
</div>
<div class="card">
  <h2>➕ 添加自定义科目</h2>
  <form action="/exam/{{ exam.id }}/add_subject" method="post" class="subject-fields">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>科目名<input name="subject" placeholder="如：政治 / 信息技术" maxlength="50" required></label>
    <label>满分<input name="max_score" inputmode="decimal" required></label>
    <label>及格线<input name="pass_score" placeholder="可空，默认60%" inputmode="decimal"></label>
    <button class="btn btn-green">添加</button>
  </form>
</div>
{% endblock %}
