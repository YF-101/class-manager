<!doctype html>
<html lang="zh">
<head>
<link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注册 · 班主任学生成绩系统</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.login-box {
  background: #fff;
  border-radius: 18px;
  padding: 32px 30px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 20px 50px rgba(0,0,0,.3);
}
.login-box h1 { font-size: 22px; color: #1e3a8a; text-align:center; margin-bottom: 6px; }
.login-box .sub { text-align:center; color:#6b7280; font-size:13px; margin-bottom: 22px; }
.field { margin-bottom: 13px; }
label { display:block; font-size:13px; color:#374151; margin-bottom:6px; font-weight:600; }
input {
  width: 100%; padding: 11px 14px;
  border: 1px solid #d1d5db; border-radius: 9px;
  font-size: 14px; outline: none;
}
input:focus { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.16); }
.btn {
  width: 100%; margin-top: 6px;
  background: linear-gradient(135deg, #16a34a, #22c55e);
  color:#fff; border:none; padding: 12px;
  border-radius: 9px; font-size: 15px; cursor: pointer;
}
.btn:hover { opacity: .92; }
.error {
  background:#fee2e2; color:#b91c1c; padding:10px 12px;
  border-radius:8px; font-size:13px; margin-bottom:14px; text-align:center;
}
.hint { text-align:center; margin-top:16px; font-size:13px; color:#6b7280; }
</style>
</head>
<body>
<div class="login-box">
  <h1>📝 注册账号</h1>
  <p class="sub">其他班主任可在此注册，注册后即可登录</p>

  {% if error %}
  <div class="error">⚠️ {{ error }}</div>
  {% endif %}

  {% include "messages.html" %}
  <form action="/register" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label>用户名</label>
      <input autocomplete="username" name="username" placeholder="给自己起个用户名" autofocus>
    </div>
    <div class="field">
      <label>邮箱（选填，用于找回密码）</label>
      <input name="email" placeholder="如 123456@qq.com">
    </div>
    <div class="field">
      <label>密码</label>
      <input autocomplete="new-password" type="password" name="password" placeholder="至少 8 位">
    </div>
    <div class="field">
      <label>确认密码</label>
      <input autocomplete="new-password" type="password" name="confirm" placeholder="再输入一次密码">
    </div>
    <button class="btn">注 册</button>
  </form>

  <p class="hint">已有账号？<a href="/login">返回登录</a></p>
</div>
</body>
</html>
