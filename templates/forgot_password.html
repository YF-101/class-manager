<!doctype html>
<html lang="zh">
<head>
<link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>忘记密码 · 班主任学生成绩系统</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.box {
  background: #fff; border-radius: 18px; padding: 32px 30px;
  width: 100%; max-width: 400px;
  box-shadow: 0 20px 50px rgba(0,0,0,.3);
}
.box h1 { font-size: 21px; color:#1e3a8a; text-align:center; margin-bottom:6px; }
.box .sub { text-align:center; color:#6b7280; font-size:13px; margin-bottom:20px; }
.field { margin-bottom: 13px; }
label { display:block; font-size:13px; color:#374151; margin-bottom:6px; font-weight:600; }
input {
  width: 100%; padding: 11px 14px;
  border:1px solid #d1d5db; border-radius:9px; font-size:14px; outline:none;
}
input:focus { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.16); }
.btn {
  width:100%; margin-top:6px;
  background: linear-gradient(135deg, #1e3a8a, #3b82f6);
  color:#fff; border:none; padding:12px;
  border-radius:9px; font-size:15px; cursor:pointer;
}
.btn:hover { opacity:.92; }
.error { background:#fee2e2; color:#b91c1c; padding:10px 12px; border-radius:8px; font-size:13px; margin-bottom:14px; text-align:center; }
.info { background:#dcfce7; color:#166534; padding:10px 12px; border-radius:8px; font-size:13px; margin-bottom:14px; text-align:center; }
.links { text-align:center; margin-top:16px; font-size:13px; }
.links a { color:#3b82f6; text-decoration:none; }
</style>
</head>
<body>
<div class="box">
  <h1>🔑 找回密码</h1>
  <p class="sub">输入注册时填写的邮箱，我们给你发验证码</p>

  {% if error %}<div class="error">⚠️ {{ error }}</div>{% endif %}
  {% if info %}<div class="info">✅ {{ info }}</div>{% endif %}

  {% include "messages.html" %}
  <form action="/forgot_password" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label>注册邮箱</label>
      <input name="email" placeholder="如 123456@qq.com" autofocus>
    </div>
    <button class="btn">发送验证码</button>
  </form>

  <div style="background:#fffbeb; border:1px solid #fde68a; color:#92400e;
              padding:10px 12px; border-radius:8px; font-size:12px;
              margin-top:14px; line-height:1.8;">
    📌 <strong>没收到验证码？</strong><br>
    ① 先去<strong>垃圾箱</strong>看看<br>
    ② 确认邮箱地址<strong>没填错</strong><br>
    ③ 等 1 分钟后，重新输入邮箱点"发送验证码"（重发会让旧码失效）
  </div>

  {% if info %}
  <p class="links"><a href="/reset_password">➡️ 已收到验证码，去重置密码</a></p>
  {% endif %}
  <p class="links"><a href="/login">← 返回登录</a></p>
</div>
</body>
</html>
