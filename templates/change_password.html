{% extends "base.html" %}
{% block content %}

{% if error %}
<p style="background:#fee2e2;color:#b91c1c;padding:12px;border-radius:8px;margin-bottom:16px;font-size:14px;">
  ⚠️ {{ error }}
</p>
{% endif %}
{% if info %}
<p style="background:#dcfce7;color:#15803d;padding:12px;border-radius:8px;margin-bottom:16px;font-size:14px;">
  ✅ {{ info }}
</p>
{% endif %}

<div class="card">
  <h2>🔑 修改我的密码</h2>
  <form action="/change_password" method="post" style="display:flex; flex-direction:column; gap:12px;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label style="font-size:13px; color:#374151;">旧密码</label>
      <input autocomplete="new-password" type="password" name="old_password" placeholder="请输入当前密码" style="width:100%; margin-top:4px;">
    </div>
    <div>
      <label style="font-size:13px; color:#374151;">新密码（至少 8 位）</label>
      <input autocomplete="new-password" type="password" name="new_password" placeholder="请输入新密码" style="width:100%; margin-top:4px;">
    </div>
    <div>
      <label style="font-size:13px; color:#374151;">确认新密码</label>
      <input autocomplete="new-password" type="password" name="confirm_password" placeholder="再输入一次新密码" style="width:100%; margin-top:4px;">
    </div>
    <button class="btn btn-green" style="margin-top:4px;">确认修改</button>
  </form>
  <p style="margin-top:14px; font-size:13px;"><a href="/">← 返回</a></p>
</div>

{% endblock %}
