<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>重置密码 · 班主任学生成绩系统</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.box {
  background: #fff; border-radius: 18px; padding: 32px 30px;
  width: 100%; max-width: 400px;
  box-shadow: 0 20px 50px rgba(0,0,0,.3);
}
.box h1 { font-size: 21px; color:#1e3a8a; text-align:center; margin-bottom:6px; }
.box .sub { text-align:center; color:#6b7280; font-size:13px; margin-bottom:20px; }
.field { margin-bottom: 13px; }
label { display:block; font-size:13px; color:#374151; margin-bottom:6px; font-weight:600; }
input {
  width: 100%; padding: 11px 14px;
  border:1px solid #d1d5db; border-radius:9px; font-size:14px; outline:none;
}
input:focus { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.16); }
.btn {
  width:100%; margin-top:6px;
  background: linear-gradient(135deg, #16a34a, #22c55e);
  color:#fff; border:none; padding:12px;
  border-radius:9px; font-size:15px; cursor:pointer;
}
.btn:hover { opacity:.92; }
.error { background:#fee2e2; color:#b91c1c; padding:10px 12px; border-radius:8px; font-size:13px; margin-bottom:14px; text-align:center; }
.links { text-align:center; margin-top:16px; font-size:13px; }
.links a { color:#3b82f6; text-decoration:none; }
</style>
</head>
<body>
<div class="box">
  <h1>🔒 设置新密码</h1>
  <p class="sub">输入邮箱、收到的验证码和新密码</p>

  {% if error %}<div class="error">⚠️ {{ error }}</div>{% endif %}

  <form action="/reset_password" method="post">
    <div class="field">
      <label>注册邮箱</label>
      <input name="email" value="{{ email or '' }}" placeholder="如 123456@qq.com" readonly style="background:#f3f4f6;">
    </div>
    <div class="field">
      <label>验证码</label>
      <input name="token" placeholder="邮箱收到的 6 位验证码" autofocus>
    </div>
    <div class="field">
      <label>新密码</label>
      <input type="password" name="new_password" placeholder="至少 6 位">
    </div>
    <div class="field">
      <label>确认新密码</label>
      <input type="password" name="confirm" placeholder="再输入一次">
    </div>
    <button class="btn">重置密码</button>
  </form>

  <p class="links"><a href="/forgot_password">← 重新获取验证码</a>　|　<a href="/login">返回登录</a></p>
</div>
</body>
</html>
