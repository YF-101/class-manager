<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 班主任学生成绩系统</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.login-box {
  background: #fff;
  border-radius: 18px;
  padding: 36px 32px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 20px 50px rgba(0,0,0,.3);
}
.login-box h1 { font-size: 22px; color: #1e3a8a; text-align:center; margin-bottom: 6px; }
.login-box .sub { text-align:center; color:#6b7280; font-size:13px; margin-bottom: 24px; }
.field { margin-bottom: 14px; }
label { display:block; font-size:13px; color:#374151; margin-bottom:6px; font-weight:600; }
input {
  width: 100%; padding: 12px 14px;
  border: 1px solid #d1d5db; border-radius: 9px;
  font-size: 14px; outline: none;
}
input:focus { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.16); }
.btn {
  width: 100%; margin-top: 8px;
  background: linear-gradient(135deg, #1e3a8a, #3b82f6);
  color:#fff; border:none; padding: 12px;
  border-radius: 9px; font-size: 15px; cursor: pointer;
}
.btn:hover { opacity: .92; }
.error {
  background:#fee2e2; color:#b91c1c; padding:10px 12px;
  border-radius:8px; font-size:13px; margin-bottom:16px; text-align:center;
}
.info {
  background:#dcfce7; color:#166534; padding:10px 12px;
  border-radius:8px; font-size:13px; margin-bottom:16px; text-align:center;
}
.links { text-align:center; margin-top:16px; font-size:13px; }
.links a { color:#3b82f6; text-decoration:none; }
.hint { text-align:center; margin-top:12px; font-size:12px; color:#9ca3af; }
</style>
</head>
<body>
<div class="login-box">
  <h1>🎓 班主任成绩系统</h1>
  <p class="sub">请登录后再使用</p>

  {% if error %}
  <div class="error">⚠️ {{ error }}</div>
  {% endif %}
  {% if info %}
  <div class="info">✅ {{ info }}</div>
  {% endif %}

  <form action="/login" method="post">
    <div class="field">
      <label>用户名</label>
      <input name="username" placeholder="请输入用户名" autofocus>
    </div>
    <div class="field">
      <label>密码</label>
      <input type="password" name="password" placeholder="请输入密码">
    </div>
    <button class="btn">登 录</button>
  </form>

  <p class="links">
    <a href="/register">📝 注册新账号</a>
    <span style="color:#d1d5db;">　|　</span>
    <a href="/forgot_password">🔑 忘记密码？</a>
  </p>
  <p class="hint">默认账号：admin　密码：admin123</p>
</div>
</body>
</html>
